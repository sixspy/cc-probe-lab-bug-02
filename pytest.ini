[pytest]
# 让仓库根目录运行 pytest test_pageblind_*.py 时也能 import app（app 包在 backend/ 下）。
# 在 backend/ 目录内运行时，本文件同样会被发现，pythonpath 相对 rootdir(/workspace) 解析为 /workspace/backend。
pythonpath = backend
testpaths = backend/tests
# 隐藏/补充测试若直接写 async def 用例，无需逐个打 @pytest.mark.asyncio。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
